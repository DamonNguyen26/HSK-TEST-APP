<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Game - Ôn Tập Từ Vựng</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HSK Game">
    <link rel="apple-touch-icon" href="../pic/logo.png">
</head>
<body>

    <!-- Header Profile -->
    <div class="header-fixed">
        <div class="profile">
            <div class="avatar">👤</div>
            <div class="info">
                <h3 id="playerName">Damon</h3>
                <p id="playerAge">18 tuổi</p>
            </div>
            <div class="player-status">
                <div id="currentHSK">HSK 1</div>
                <div id="playerRank">Đồng</div>
            </div>
        </div>
    </div>

    <div class="container has-hsk">
        <div class="review-banner">
            <div class="review-banner-text">
                <h2>📖 ÔN TẬP TỪ VỰNG</h2>
                <p>Củng cố lại những từ bạn chưa nhớ</p>
            </div>
            <div class="review-count-badge" id="reviewCount" style="display: none;">0 từ cần ôn</div>
        </div>

        <!-- 1. TAB CHÍNH: SAI TỪ GAME / FLASHCARD -->
        <div class="hsk-tabs" style="margin-bottom: 10px; justify-content: center;">
            <div class="hsk-tab active-tab" id="tabGame" onclick="switchReviewTab('game')">🎮 Sai từ Game</div>
            <div class="hsk-tab" id="tabFlashcard" onclick="switchReviewTab('flashcard')">📇 Chưa thuộc (Flashcard)</div>
        </div>

        <!-- 2. TAB PHỤ: LỌC THEO CẤP ĐỘ HSK -->
        <div class="hsk-tabs" style="margin-bottom: 15px; overflow-x: auto;">
            <div class="hsk-tab active-tab" id="reviewHsk_all" onclick="filterReviewHsk('all')">Tất cả</div>
            <div class="hsk-tab" id="reviewHsk_1" onclick="filterReviewHsk('1')">HSK 1</div>
            <div class="hsk-tab" id="reviewHsk_2" onclick="filterReviewHsk('2')">HSK 2</div>
            <div class="hsk-tab" id="reviewHsk_3" onclick="filterReviewHsk('3')">HSK 3</div>
            <div class="hsk-tab" id="reviewHsk_4" onclick="filterReviewHsk('4')">HSK 4</div>
            <div class="hsk-tab" id="reviewHsk_5" onclick="filterReviewHsk('5')">HSK 5</div>
            <div class="hsk-tab" id="reviewHsk_6" onclick="filterReviewHsk('6')">HSK 6</div>
        </div>

        <!-- DANH SÁCH TỪ VỰNG -->
        <div id="reviewList"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="../index.html" class="nav-btn"><span class="icon">🏠</span>Trang chủ</a>
        <a href="gamecenter.html" class="logo-btn"><img src="../pic/logo.png" alt="Logo"></a>
        <a href="setting.html" class="nav-btn"><span class="icon">⚙️</span>Cài đặt</a>
    </div>

    <script src="../js/core.js"></script>
    <script src="../js/review.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
